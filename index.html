<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Auto Ladelog & Kosten</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="zap" class="text-amber-500"></i> E-Auto Ladelog
                </h1>
                <p class="text-sm text-slate-500">Solar (9ct) | Tag (31ct) | Nacht (18ct)</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportCSV()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg flex items-center gap-1 transition">
                    <i data-lucide="download" class="w-4 h-4"></i> Export CSV
                </button>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Gesamtkosten</span>
                <div class="text-2xl font-bold text-slate-900 mt-1" id="statKosten">0,00 €</div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Gesamt geladen</span>
                <div class="text-2xl font-bold text-slate-900 mt-1" id="statKwh">0,0 kWh</div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ø Preis / kWh</span>
                <div class="text-2xl font-bold text-slate-900 mt-1" id="statAvg">0,00 €</div>
            </div>
        </div>

        <!-- Formular -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 text-slate-900 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> Ladevorgang hinzufügen
            </h2>
            <form id="chargeForm" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Datum</label>
                    <input type="date" id="date" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Menge (kWh)</label>
                    <input type="number" step="0.1" id="kwh" placeholder="z. B. 35.5" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Ladeart</label>
                    <select id="type" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Solar">Solar (0,09 €)</option>
                        <option value="Tag">Tag (0,31 €)</option>
                        <option value="Nacht">Nacht (0,18 €)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Notiz (Optional)</label>
                    <input type="text" id="note" placeholder="z. B. Zuhause" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2 rounded-lg transition flex items-center justify-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i> Speichern
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabelle -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="p-4">Datum</th>
                            <th class="p-4">Menge</th>
                            <th class="p-4">Ladeart</th>
                            <th class="p-4">Tarif</th>
                            <th class="p-4">Kosten</th>
                            <th class="p-4">Notiz</th>
                            <th class="p-4 text-right">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="logTable" class="divide-y divide-slate-100 text-sm">
                        <!-- Einträge werden per JS eingefügt -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const TARIFE = { 'Solar': 0.09, 'Tag': 0.31, 'Nacht': 0.18 };
        let entries = JSON.parse(localStorage.getItem('ev_charge_logs')) || [];

        document.getElementById('date').valueAsDate = new Date();

        function saveAndRender() {
            localStorage.setItem('ev_charge_logs', JSON.stringify(entries));
            render();
        }

        function render() {
            const table = document.getElementById('logTable');
            table.innerHTML = '';

            let totalKwh = 0;
            let totalCost = 0;

            entries.sort((a, b) => new Date(b.date) - new Date(a.date));

            entries.forEach((item, index) => {
                const rate = TARIFE[item.type];
                const cost = item.kwh * rate;
                totalKwh += item.kwh;
                totalCost += cost;

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition";
                row.innerHTML = `
                    <td class="p-4 font-medium text-slate-900">${item.date}</td>
                    <td class="p-4">${item.kwh.toFixed(1)} kWh</td>
                    <td class="p-4">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full ${
                            item.type === 'Solar' ? 'bg-amber-100 text-amber-800' :
                            item.type === 'Tag' ? 'bg-blue-100 text-blue-800' : 'bg-indigo-100 text-indigo-800'
                        }">
                            ${item.type}
                        </span>
                    </td>
                    <td class="p-4 text-slate-500">${rate.toFixed(2)} €</td>
                    <td class="p-4 font-semibold text-slate-900">${cost.toFixed(2)} €</td>
                    <td class="p-4 text-slate-500">${item.note || '-'}</td>
                    <td class="p-4 text-right">
                        <button onclick="deleteEntry(${index})" class="text-rose-500 hover:text-rose-700 p-1">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                `;
                table.appendChild(row);
            });

            document.getElementById('statKosten').innerText = totalCost.toFixed(2) + ' €';
            document.getElementById('statKwh').innerText = totalKwh.toFixed(1) + ' kWh';
            document.getElementById('statAvg').innerText = totalKwh > 0 ? (totalCost / totalKwh).toFixed(2) + ' €' : '0,00 €';

            lucide.createIcons();
        }

        document.getElementById('chargeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const kwh = parseFloat(document.getElementById('kwh').value);
            const type = document.getElementById('type').value;
            const note = document.getElementById('note').value;

            entries.push({ date, kwh, type, note });
            document.getElementById('kwh').value = '';
            document.getElementById('note').value = '';
            saveAndRender();
        });

        function deleteEntry(index) {
            entries.splice(index, 1);
            saveAndRender();
        }

        function exportCSV() {
            let csv = "Datum,kWh,Ladeart,Tarif (€/kWh),Kosten (€),Notiz\n";
            entries.forEach(e => {
                const cost = e.kwh * TARIFE[e.type];
                csv += `${e.date},${e.kwh},${e.type},${TARIFE[e.type]},${cost.toFixed(2)},"${e.note || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ladelog_export.csv';
            a.click();
        }

        render();
    </script>
</body>
</html>
