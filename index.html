<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Auto Ladelog & Kosten</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --solar-bg: #fef3c7; --solar-text: #92400e;
            --tag-bg: #dbeafe; --tag-text: #1e40af;
            --nacht-bg: #e0e7ff; --nacht-text: #3730a3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 1rem; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1rem 1.25rem; border-radius: 12px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 0.75rem; }
        h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .sub { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; }

        .btn-group { display: flex; gap: 0.5rem; }
        .btn { padding: 0.5rem 0.85rem; font-size: 0.85rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 0.35rem; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: #e2e8f0; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
        .stat-card { background: var(--card-bg); padding: 0.9rem 1.1rem; border-radius: 10px; border: 1px solid var(--border-color); }
        .stat-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-size: 1.35rem; font-weight: 700; margin-top: 0.2rem; }

        .card { background: var(--card-bg); padding: 1.25rem; border-radius: 12px; border: 1px solid var(--border-color); }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.85rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }
        input, select { padding: 0.5rem 0.65rem; font-size: 0.85rem; border: 1px solid var(--border-color); border-radius: 8px; background-color: #fff; outline: none; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15); }

        .table-container { overflow-x: auto; margin-top: 0.5rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        th { background-color: #f8fafc; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; user-select: none; }
        th:hover { background-color: #f1f5f9; color: var(--text-main); }
        td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border-color); }
        tr:hover td { background-color: #f8fafc; }

        .badge { padding: 0.2rem 0.5rem; font-size: 0.7rem; font-weight: 600; border-radius: 9999px; display: inline-block; }
        .badge-solar { background-color: var(--solar-bg); color: var(--solar-text); }
        .badge-tag { background-color: var(--tag-bg); color: var(--tag-text); }
        .badge-nacht { background-color: var(--nacht-bg); color: var(--nacht-text); }

        .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.2rem 0.4rem; border-radius: 4px; }
        .btn-icon:hover { color: var(--danger); background-color: #fee2e2; }

        .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; }

        /* Notification toast */
        #toast { position: fixed; bottom: 1rem; right: 1rem; background: var(--text-main); color: #fff; padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.8rem; display: none; z-index: 100; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>⚡ E-Auto Ladelog</h1>
                <span class="sub">Solar: 0,09 € | Tag: 0,31 € | Nacht: 0,18 €</span>
            </div>
            <div class="btn-group">
                <!-- CSV File Input with full fallback mime type support -->
                <input type="file" id="csvFileInput" accept=".csv, text/csv, text/plain, application/vnd.ms-excel, */*" style="display:none" onchange="importCSV(event)">
                <button type="button" class="btn btn-secondary" onclick="triggerFileInput()">📥 Import CSV</button>
                <button type="button" class="btn btn-secondary" onclick="exportCSV()">📤 Export CSV</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Gesamtkosten</div>
                <div class="stat-value" id="statKosten">0,00 €</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Gesamt Energie</div>
                <div class="stat-value" id="statKwh">0,0 kWh</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ø Preis / kWh</div>
                <div class="stat-value" id="statAvg">0,00 €</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Neuen Ladevorgang eintragen</div>
            <form id="chargeForm" onsubmit="addEntry(event)" class="form-grid">
                <div class="form-group">
                    <label for="date">Datum</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="kwh">Menge (kWh)</label>
                    <input type="number" id="kwh" step="0.01" min="0.01" placeholder="z. B. 35.5" required>
                </div>
                <div class="form-group">
                    <label for="type">Ladeart</label>
                    <select id="type">
                        <option value="Solar">Solar (0,09 €)</option>
                        <option value="Tag">Tag (0,31 €)</option>
                        <option value="Nacht">Nacht (0,18 €)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="note">Notiz (Optional)</label>
                    <input type="text" id="note" placeholder="z. B. Wallbox">
                </div>
                <button type="submit" class="btn btn-primary">Hinzufügen</button>
            </form>
        </div>

        <div class="card">
            <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
                <span>Ladehistorie</span>
                <span id="recordCount" class="sub">0 Einträge</span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortTable('date')">Datum <span id="sort-date">▼</span></th>
                            <th onclick="sortTable('kwh')">Menge (kWh) <span id="sort-kwh"></span></th>
                            <th onclick="sortTable('type')">Ladeart <span id="sort-type"></span></th>
                            <th onclick="sortTable('rate')">Tarif <span id="sort-rate"></span></th>
                            <th onclick="sortTable('cost')">Kosten <span id="sort-cost"></span></th>
                            <th onclick="sortTable('note')">Notiz <span id="sort-note"></span></th>
                            <th style="text-align:right; cursor:default;">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
                <div id="emptyState" class="empty-state">Keine Einträge vorhanden. Füge den ersten Ladevorgang oben hinzu.</div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const TARIFE = { 'Solar': 0.09, 'Tag': 0.31, 'Nacht': 0.18 };
        let entries = [];
        let sortCol = 'date';
        let sortAsc = false;

        window.onload = function() {
            document.getElementById('date').valueAsDate = new Date();
            const stored = localStorage.getItem('ev_logs');
            if (stored) {
                try { entries = JSON.parse(stored); } catch(e) { entries = []; }
            }
            render();
        };

        function save() {
            localStorage.setItem('ev_logs', JSON.stringify(entries));
            render();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function addEntry(e) {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const kwh = parseFloat(document.getElementById('kwh').value);
            const type = document.getElementById('type').value;
            const note = document.getElementById('note').value.trim();

            if (!date || isNaN(kwh) || kwh <= 0) return;

            entries.push({ id: Date.now().toString(), date, kwh, type, note });
            document.getElementById('kwh').value = '';
            document.getElementById('note').value = '';
            
            save();
            showToast('Ladevorgang gespeichert');
        }

        function deleteEntry(id) {
            entries = entries.filter(item => item.id !== id);
            save();
            showToast('Eintrag gelöscht');
        }

        function sortTable(col) {
            if (sortCol === col) {
                sortAsc = !sortAsc;
            } else {
                sortCol = col;
                sortAsc = true;
            }
            render();
        }

        function render() {
            const tbody = document.getElementById('logTable');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            let totalKwh = 0;
            let totalCost = 0;

            // Sort entries
            entries.sort((a, b) => {
                let valA, valB;
                if (sortCol === 'date') { valA = a.date; valB = b.date; }
                else if (sortCol === 'kwh') { valA = a.kwh; valB = b.kwh; }
                else if (sortCol === 'type') { valA = a.type; valB = b.type; }
                else if (sortCol === 'rate') { valA = TARIFE[a.type] || 0; valB = TARIFE[b.type] || 0; }
                else if (sortCol === 'cost') { valA = a.kwh * (TARIFE[a.type] || 0); valB = b.kwh * (TARIFE[b.type] || 0); }
                else if (sortCol === 'note') { valA = (a.note || '').toLowerCase(); valB = (b.note || '').toLowerCase(); }

                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });

            // Update Sort Indicators
            ['date', 'kwh', 'type', 'rate', 'cost', 'note'].forEach(col => {
                const el = document.getElementById(`sort-${col}`);
                if (el) el.innerText = sortCol === col ? (sortAsc ? '▲' : '▼') : '';
            });

            entries.forEach(item => {
                const rate = TARIFE[item.type] || 0;
                const cost = item.kwh * rate;
                totalKwh += item.kwh;
                totalCost += cost;

                const tr = document.createElement('tr');
                const badgeClass = item.type === 'Solar' ? 'badge-solar' : (item.type === 'Tag' ? 'badge-tag' : 'badge-nacht');

                tr.innerHTML = `
                    <td>${formatDate(item.date)}</td>
                    <td><strong>${item.kwh.toFixed(2)}</strong> kWh</td>
                    <td><span class="badge ${badgeClass}">${item.type}</span></td>
                    <td>${rate.toFixed(2).replace('.', ',')} €</td>
                    <td><strong>${cost.toFixed(2).replace('.', ',')} €</strong></td>
                    <td style="color:var(--text-muted);">${escapeHtml(item.note || '-')}</td>
                    <td style="text-align:right;">
                        <button class="btn-icon" onclick="deleteEntry('${item.id}')" title="Löschen">🗑</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // KPI calculation
            document.getElementById('statKosten').innerText = totalCost.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('statKwh').innerText = totalKwh.toFixed(1).replace('.', ',') + ' kWh';
            document.getElementById('statAvg').innerText = totalKwh > 0 ? (totalCost / totalKwh).toFixed(2).replace('.', ',') + ' €' : '0,00 €';
            document.getElementById('recordCount').innerText = `${entries.length} Einträge`;

            emptyState.style.display = entries.length === 0 ? 'block' : 'none';
        }

        function formatDate(d) {
            const p = d.split('-');
            return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : d;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function triggerFileInput() {
            const fileInput = document.getElementById('csvFileInput');
            fileInput.value = ''; // Clear selection to allow re-uploading same file
            fileInput.click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                let importedCount = 0;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    // Support comma or semicolon separation
                    const delim = line.includes(';') ? ';' : ',';
                    const parts = line.split(delim).map(p => p.trim().replace(/^"|"$/g, ''));

                    if (parts.length >= 3) {
                        let date = parts[0];
                        let kwhRaw = parts[1];
                        let typeRaw = parts[2];
                        let note = parts[5] || parts[3] || '';

                        // Skip header row if present
                        if (isNaN(parseFloat(kwhRaw.replace(',', '.'))) && i === 0) continue;

                        // Normalize date DD.MM.YYYY to YYYY-MM-DD
                        if (date.includes('.')) {
                            const dp = date.split('.');
                            if (dp.length === 3) date = `${dp[2]}-${dp[1].padStart(2, '0')}-${dp[0].padStart(2, '0')}`;
                        }

                        const kwh = parseFloat(kwhRaw.replace(',', '.'));
                        if (!date || isNaN(kwh)) continue;

                        let type = 'Tag';
                        const tLower = typeRaw.toLowerCase();
                        if (tLower.includes('solar') || tLower.includes('sonne')) type = 'Solar';
                        else if (tLower.includes('nacht')) type = 'Nacht';

                        entries.push({
                            id: (Date.now() + i + Math.random()).toString(),
                            date: date,
                            kwh: kwh,
                            type: type,
                            note: note !== typeRaw && note !== kwhRaw ? note : ''
                        });
                        importedCount++;
                    }
                }

                if (importedCount > 0) {
                    save();
                    showToast(`${importedCount} Einträge erfolgreich importiert`);
                } else {
                    showToast('Keine gültigen Ladedaten gefunden');
                }
            };

            reader.readAsText(file);
        }

        function exportCSV() {
            if (entries.length === 0) {
                showToast('Keine Daten zum Exportieren');
                return;
            }

            let csv = "Datum;kWh;Ladeart;Tarif (€);Kosten (€);Notiz\n";
            entries.forEach(item => {
                const rate = TARIFE[item.type] || 0;
                const cost = item.kwh * rate;
                csv += `${item.date};${item.kwh.toString().replace('.', ',')};${item.type};${rate.toString().replace('.', ',')};${cost.toFixed(2).replace('.', ',')};"${(item.note || '').replace(/"/g, '""')}"\n`;
            });

            // UTF-8 BOM for correct character encoding in Excel
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `E-Auto_Ladelog_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('CSV Export erfolgreich');
        }
    </script>
</body>
</html>
