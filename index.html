<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Auto Ladelog</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #cbd5e1; --primary: #2563eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; max-width: 1000px; margin: 0 auto; line-height: 1.4; }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .kpi { font-size: 1.3rem; font-weight: bold; margin-top: 4px; }
        .kpi-sub { font-size: 0.75rem; color: #64748b; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; align-items: end; }
        label { font-size: 0.75rem; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
        input, select, button { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        button.sec { background: #e2e8f0; color: #1e293b; }
        .actions { display: flex; gap: 8px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
        th { background: #f1f5f9; cursor: pointer; user-select: none; }
        th:hover { background: #e2e8f0; }
        tr:hover { background: #f8fafc; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .b-solar { background: #fef3c7; color: #92400e; }
        .b-tag { background: #e0f2fe; color: #075985; }
        .b-nacht { background: #e0e7ff; color: #3730a3; }
        .paid-btn { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; border: none; }
        .unpaid-btn { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; border: none; }
        .del-btn { background: none; color: #ef4444; border: none; cursor: pointer; font-size: 1rem; width: auto; padding: 0 5px; }
        .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
        .filter-inputs { display: flex; gap: 10px; align-items: center; }
        .filter-inputs input { width: auto; }
    </style>
</head>
<body>

    <header>
        <h2>⚡ E-Auto Ladelog</h2>
        <div class="actions">
            <button onclick="document.getElementById('csvInput').click()" class="sec">📂 CSV Import</button>
            <button onclick="exportCSV()" class="sec">💾 CSV Export</button>
            <input type="file" id="csvInput" accept=".csv,text/plain" style="display:none" onchange="importCSV(event)">
        </div>
    </header>

    <!-- KPIs -->
    <div class="grid card">
        <div>
            <label>Gesamtkosten</label>
            <div class="kpi" id="kpiKosten">0,00 €</div>
            <div class="kpi-sub" id="kpiSplit">Offen: 0,00 €</div>
        </div>
        <div>
            <label>Gesamt kWh</label>
            <div class="kpi" id="kpiKwh">0,0 kWh</div>
        </div>
        <div>
            <label>Ø Preis / kWh</label>
            <div class="kpi" id="kpiAvg">0,00 €</div>
        </div>
    </div>

    <!-- Neuer Eintrag -->
    <div class="card">
        <form id="addForm">
            <div>
                <label>Datum</label>
                <input type="date" id="fDate" required>
            </div>
            <div>
                <label>kWh</label>
                <input type="number" step="0.1" id="fKwh" placeholder="35.5" required>
            </div>
            <div>
                <label>Ladeart</label>
                <select id="fType">
                    <option value="Nacht" selected>Nacht (0,18 €)</option>
                    <option value="Solar">Solar (0,09 €)</option>
                    <option value="Tag">Tag (0,31 €)</option>
                </select>
            </div>
            <div>
                <label>Notiz</label>
                <input type="text" id="fNote" placeholder="z.B. Garage">
            </div>
            <div>
                <label>&nbsp;</label>
                <button type="submit">Speichern</button>
            </div>
        </form>
    </div>

    <!-- Filter & Tabelle -->
    <div class="card">
        <div class="filter-row" style="margin-bottom: 15px;">
            <div class="filter-inputs">
                <label>Von: <input type="date" id="fFrom" onchange="render()"></label>
                <label>Bis: <input type="date" id="fTo" onchange="render()"></label>
            </div>
            <button onclick="resetFilter()" class="sec" style="width: auto;">Filter zurücksetzen</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('date')">Datum <span id="s-date"></span></th>
                        <th onclick="sortTable('kwh')">kWh <span id="s-kwh"></span></th>
                        <th onclick="sortTable('type')">Art <span id="s-type"></span></th>
                        <th onclick="sortTable('rate')">Tarif <span id="s-rate"></span></th>
                        <th onclick="sortTable('cost')">Kosten <span id="s-cost"></span></th>
                        <th>Bezahlt</th>
                        <th>Notiz</th>
                        <th style="text-align:right">Aktion</th>
                    </tr>
                </thead>
                <tbody id="tb"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
